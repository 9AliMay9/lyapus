name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: lyapus
          POSTGRES_PASSWORD: lyapus
          POSTGRES_DB: lyapus_verify_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U lyapus -d lyapus_verify_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Prepare integration database
        env:
          LYAPUS_TEST_DATABASE_URL: "postgres://lyapus:lyapus@127.0.0.1:${{ job.services.postgres.ports[5432] }}/lyapus_verify_test?sslmode=disable"
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/install-atlas-community.sh

          ./.tools/bin/atlas migrate apply \
            --dir "file://db/migrations" \
            --url "$LYAPUS_TEST_DATABASE_URL"

          ./.tools/bin/atlas migrate status \
            --dir "file://db/migrations" \
            --url "$LYAPUS_TEST_DATABASE_URL"

      - name: Verify
        env:
          LYAPUS_TEST_DATABASE_URL: "postgres://lyapus:lyapus@127.0.0.1:${{ job.services.postgres.ports[5432] }}/lyapus_verify_test?sslmode=disable"
        run: make verify

  atlas-community:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build pinned Atlas Community
        run: ./scripts/install-atlas-community.sh

      - name: Verify versioned migrations
        shell: bash
        run: |
          set -euo pipefail

          ./.tools/bin/atlas migrate diff schema_unchanged \
            --dir "file://db/migrations" \
            --to "file://db/schema.sql" \
            --dev-url "docker://postgres/16.14/dev?search_path=public"

          container_name='lyapus-atlas-ci-pg'
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container_name" \
            --env POSTGRES_USER=atlas \
            --env POSTGRES_PASSWORD=atlas \
            --env POSTGRES_DB=lyapus_atlas_test \
            --publish 127.0.0.1:55432:5432 \
            postgres:16.14 >/dev/null

          ready=false
          for _ in $(seq 1 30); do
            if docker exec "$container_name" \
              pg_isready -U atlas -d lyapus_atlas_test >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            docker logs "$container_name"
            exit 1
          fi

          sleep 2

          if ! docker exec "$container_name" \
            psql -U atlas -d lyapus_atlas_test \
              -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null; then
            docker logs "$container_name"
            exit 1
          fi

          database_url='postgres://atlas:atlas@127.0.0.1:55432/lyapus_atlas_test?sslmode=disable'

          ./.tools/bin/atlas migrate apply \
            --dir "file://db/migrations" \
            --url "$database_url"

          ./.tools/bin/atlas migrate status \
            --dir "file://db/migrations" \
            --url "$database_url"

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: lyapus
          POSTGRES_PASSWORD: lyapus
          POSTGRES_DB: lyapus_smoke
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U lyapus -d lyapus_smoke"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build pinned Atlas Community
        run: ./scripts/install-atlas-community.sh

      - name: Migrate smoke database
        env:
          LYAPUS_DATABASE_URL: "postgres://lyapus:lyapus@127.0.0.1:${{ job.services.postgres.ports[5432] }}/lyapus_smoke?sslmode=disable"
        shell: bash
        run: |
          set -euo pipefail

          ./.tools/bin/atlas migrate apply \
            --dir "file://db/migrations" \
            --url "$LYAPUS_DATABASE_URL"

          ./.tools/bin/atlas migrate status \
            --dir "file://db/migrations" \
            --url "$LYAPUS_DATABASE_URL"

      - name: Start service and smoke-test catalog API
        env:
          LYAPUS_DATABASE_URL: "postgres://lyapus:lyapus@127.0.0.1:${{ job.services.postgres.ports[5432] }}/lyapus_smoke?sslmode=disable"
        shell: bash
        run: |
          set -euo pipefail

          go run ./cmd/apiserver >server.log 2>&1 &
          server_pid=$!

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              wait "$server_pid" || true
            fi
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/livez >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat server.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8080/livez
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz

          invalid_status="$(
            curl --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"slug":"Invalid","name":"Invalid"}' \
              --dump-header invalid.headers \
              --output invalid.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:8080/v1/teams
          )"

          if [ "$invalid_status" != 400 ]; then
            cat invalid.headers invalid.json server.log
            exit 1
          fi

          invalid_header_id="$(
            grep --ignore-case '^x-request-id:' invalid.headers |
              head -n 1 |
              awk '{print $2}' |
              tr -d '\r'
          )"
          invalid_body_id="$(
            sed -n 's/.*"request_id":"\([^"]*\)".*/\1/p' invalid.json
          )"

          if [ -z "$invalid_header_id" ] ||
            [ "$invalid_header_id" != "$invalid_body_id" ] ||
            ! grep --fixed-strings --quiet '"code":"invalid_argument"' invalid.json; then
            cat invalid.headers invalid.json server.log
            exit 1
          fi

          created_status="$(
            curl --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"slug":"ci-smoke","name":"CI Smoke"}' \
              --dump-header created.headers \
              --output created.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:8080/v1/teams
          )"

          if [ "$created_status" != 201 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' created.headers ||
            ! grep --fixed-strings --quiet '"slug":"ci-smoke"' created.json; then
            cat created.headers created.json server.log
            exit 1
          fi

          created_id="$(
            sed -n 's/.*"id":\([0-9][0-9]*\).*/\1/p' created.json
          )"

          if [ -z "$created_id" ]; then
            cat created.headers created.json server.log
            exit 1
          fi

          get_status="$(
            curl --silent --show-error \
              --dump-header get.headers \
              --output get.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/teams/$created_id"
          )"

          if [ "$get_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' get.headers ||
            ! grep --fixed-strings --quiet '"id":'"$created_id" get.json ||
            ! grep --fixed-strings --quiet '"slug":"ci-smoke"' get.json; then
            cat created.headers created.json get.headers get.json server.log
            exit 1
          fi

          list_status="$(
            curl --silent --show-error \
              --dump-header list.headers \
              --output list.json \
              --write-out '%{http_code}' \
              'http://127.0.0.1:8080/v1/teams?limit=1'
          )"

          if [ "$list_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' list.headers ||
            ! grep --fixed-strings --quiet '"items":[{"id":'"$created_id" list.json ||
            ! grep --fixed-strings --quiet '"next_cursor":""' list.json; then
            cat created.headers created.json list.headers list.json server.log
            exit 1
          fi

          service_parent_status="$(
            curl --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"slug":"service-smoke","name":"Service Smoke"}' \
              --dump-header service-parent.headers \
              --output service-parent.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:8080/v1/teams
          )"

          if [ "$service_parent_status" != 201 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' service-parent.headers ||
            ! grep --fixed-strings --quiet '"slug":"service-smoke"' service-parent.json; then
            cat service-parent.headers service-parent.json server.log
            exit 1
          fi

          service_team_id="$(
            sed -n 's/.*"id":\([0-9][0-9]*\).*/\1/p' service-parent.json
          )"

          if [ -z "$service_team_id" ]; then
            cat service-parent.headers service-parent.json server.log
            exit 1
          fi

          service_created_status="$(
            curl --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"team_id":'"$service_team_id"',"slug":"catalog","name":"Service Catalog","description":"CI smoke service","environments":[{"slug":"production","name":"Production"}]}' \
              --dump-header service-created.headers \
              --output service-created.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:8080/v1/services
          )"

          if [ "$service_created_status" != 201 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' service-created.headers ||
            ! grep --fixed-strings --quiet '"team_id":'"$service_team_id" service-created.json ||
            ! grep --fixed-strings --quiet '"slug":"catalog"' service-created.json ||
            ! grep --fixed-strings --quiet '"environments":[{"id":' service-created.json ||
            ! grep --fixed-strings --quiet '"slug":"production"' service-created.json; then
            cat service-created.headers service-created.json server.log
            exit 1
          fi

          service_created_id="$(
            sed -n 's/.*"id":\([0-9][0-9]*\),"team_id":.*/\1/p' service-created.json
          )"

          if [ -z "$service_created_id" ]; then
            cat service-created.headers service-created.json server.log
            exit 1
          fi

          service_get_status="$(
            curl --silent --show-error \
              --dump-header service-get.headers \
              --output service-get.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/services/$service_created_id"
          )"

          if [ "$service_get_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' service-get.headers ||
            ! grep --fixed-strings --quiet '"id":'"$service_created_id" service-get.json ||
            ! grep --fixed-strings --quiet '"team_id":'"$service_team_id" service-get.json ||
            ! grep --fixed-strings --quiet '"slug":"catalog"' service-get.json ||
            ! grep --fixed-strings --quiet '"environments":[{"id":' service-get.json ||
            ! grep --fixed-strings --quiet '"slug":"production"' service-get.json; then
            cat service-created.headers service-created.json service-get.headers service-get.json server.log
            exit 1
          fi

          service_list_status="$(
            curl --silent --show-error \
              --dump-header service-list.headers \
              --output service-list.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/services?team_id=$service_team_id&limit=1"
          )"

          if [ "$service_list_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' service-list.headers ||
            ! grep --fixed-strings --quiet '"items":[{"id":'"$service_created_id" service-list.json ||
            ! grep --fixed-strings --quiet '"team_id":'"$service_team_id" service-list.json ||
            ! grep --fixed-strings --quiet '"slug":"catalog"' service-list.json ||
            ! grep --fixed-strings --quiet '"next_cursor":""' service-list.json ||
            grep --fixed-strings --quiet '"environments"' service-list.json; then
            cat service-created.headers service-created.json service-list.headers service-list.json server.log
            exit 1
          fi

          service_updated_status="$(
            curl --silent --show-error \
              --request PATCH \
              --header 'Content-Type: application/json' \
              --data '{"name":"Service Catalog Updated"}' \
              --dump-header service-updated.headers \
              --output service-updated.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/services/$service_created_id"
          )"

          if [ "$service_updated_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' service-updated.headers ||
            ! grep --fixed-strings --quiet '"id":'"$service_created_id" service-updated.json ||
            ! grep --fixed-strings --quiet '"team_id":'"$service_team_id" service-updated.json ||
            ! grep --fixed-strings --quiet '"slug":"catalog"' service-updated.json ||
            ! grep --fixed-strings --quiet '"name":"Service Catalog Updated"' service-updated.json ||
            ! grep --fixed-strings --quiet '"description":"CI smoke service"' service-updated.json ||
            grep --fixed-strings --quiet '"environments"' service-updated.json; then
            cat service-updated.headers service-updated.json server.log
            exit 1
          fi

          service_cleared_status="$(
            curl --silent --show-error \
              --request PATCH \
              --header 'Content-Type: application/json' \
              --data '{"description":null}' \
              --dump-header service-cleared.headers \
              --output service-cleared.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/services/$service_created_id"
          )"

          if [ "$service_cleared_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' service-cleared.headers ||
            ! grep --fixed-strings --quiet '"id":'"$service_created_id" service-cleared.json ||
            ! grep --fixed-strings --quiet '"name":"Service Catalog Updated"' service-cleared.json ||
            ! grep --fixed-strings --quiet '"description":null' service-cleared.json ||
            grep --fixed-strings --quiet '"environments"' service-cleared.json; then
            cat service-cleared.headers service-cleared.json server.log
            exit 1
          fi

          service_delete_conflict_status="$(
            curl --silent --show-error \
              --request DELETE \
              --dump-header service-delete-conflict.headers \
              --output service-delete-conflict.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/services/$service_created_id"
          )"

          service_delete_conflict_header_id="$(
            grep --ignore-case '^x-request-id:' service-delete-conflict.headers |
              head -n 1 |
              awk '{print $2}' |
              tr -d '\r'
          )"

          service_delete_conflict_body_id="$(
            sed -n 's/.*"request_id":"\([^"]*\)".*/\1/p' service-delete-conflict.json
          )"

          if [ "$service_delete_conflict_status" != 409 ] ||
            [ -z "$service_delete_conflict_header_id" ] ||
            [ "$service_delete_conflict_header_id" != "$service_delete_conflict_body_id" ] ||
            ! grep --fixed-strings --quiet '"code":"conflict"' service-delete-conflict.json; then
            cat service-delete-conflict.headers service-delete-conflict.json server.log
            exit 1
          fi

          service_deletable_status="$(
            curl --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"team_id":'"$service_team_id"',"slug":"deletable","name":"Deletable Service"}' \
              --dump-header service-deletable.headers \
              --output service-deletable.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:8080/v1/services
          )"

          if [ "$service_deletable_status" != 201 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' service-deletable.headers ||
            ! grep --fixed-strings --quiet '"team_id":'"$service_team_id" service-deletable.json ||
            ! grep --fixed-strings --quiet '"slug":"deletable"' service-deletable.json ||
            ! grep --fixed-strings --quiet '"environments":[]' service-deletable.json; then
            cat service-deletable.headers service-deletable.json server.log
            exit 1
          fi

          service_deletable_id="$(
            sed -n 's/.*"id":\([0-9][0-9]*\),"team_id":.*/\1/p' service-deletable.json
          )"

          if [ -z "$service_deletable_id" ]; then
            cat service-deletable.headers service-deletable.json server.log
            exit 1
          fi

          service_deleted_status="$(
            curl --silent --show-error \
              --request DELETE \
              --dump-header service-deleted.headers \
              --output service-deleted.body \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/services/$service_deletable_id"
          )"

          if [ "$service_deleted_status" != 204 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' service-deleted.headers ||
            [ -s service-deleted.body ]; then
            cat service-deleted.headers service-deleted.body server.log
            exit 1
          fi

          service_missing_status="$(
            curl --silent --show-error \
              --dump-header service-missing.headers \
              --output service-missing.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/services/$service_deletable_id"
          )"

          service_missing_header_id="$(
            grep --ignore-case '^x-request-id:' service-missing.headers |
              head -n 1 |
              awk '{print $2}' |
              tr -d '\r'
          )"
          service_missing_body_id="$(
            sed -n 's/.*"request_id":"\([^"]*\)".*/\1/p' service-missing.json
          )"

          if [ "$service_missing_status" != 404 ] ||
            [ -z "$service_missing_header_id" ] ||
            [ "$service_missing_header_id" != "$service_missing_body_id" ] ||
            ! grep --fixed-strings --quiet '"code":"not_found"' service-missing.json; then
            cat service-missing.headers service-missing.json server.log
            exit 1
          fi

          environment_created_status="$(
            curl --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"service_id":'"$service_created_id"',"slug":"staging","name":"Staging"}' \
              --dump-header environment-created.headers \
              --output environment-created.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:8080/v1/environments
          )"

          if [ "$environment_created_status" != 201 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' environment-created.headers ||
            ! grep --fixed-strings --quiet '"service_id":'"$service_created_id" environment-created.json ||
            ! grep --fixed-strings --quiet '"slug":"staging"' environment-created.json; then
            cat environment-created.headers environment-created.json server.log
            exit 1
          fi

          environment_created_id="$(
            sed -n 's/.*"id":\([0-9][0-9]*\),"service_id":.*/\1/p' environment-created.json
          )"

          if [ -z "$environment_created_id" ]; then
            cat environment-created.headers environment-created.json server.log
            exit 1
          fi

          environment_get_status="$(
            curl --silent --show-error \
              --dump-header environment-get.headers \
              --output environment-get.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/environments/$environment_created_id"
          )"

          if [ "$environment_get_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' environment-get.headers ||
            ! grep --fixed-strings --quiet '"id":'"$environment_created_id" environment-get.json ||
            ! grep --fixed-strings --quiet '"service_id":'"$service_created_id" environment-get.json ||
            ! grep --fixed-strings --quiet '"slug":"staging"' environment-get.json; then
            cat environment-get.headers environment-get.json server.log
            exit 1
          fi

          environment_list_status="$(
            curl --silent --show-error \
              --dump-header environment-list.headers \
              --output environment-list.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/environments?service_id=$service_created_id&limit=1"
          )"

          environment_next_cursor="$(
            sed -n 's/.*"next_cursor":"\([^"]*\)".*/\1/p' environment-list.json
          )"

          if [ "$environment_list_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' environment-list.headers ||
            ! grep --fixed-strings --quiet '"items":[{"id":'"$environment_created_id" environment-list.json ||
            ! grep --fixed-strings --quiet '"service_id":'"$service_created_id" environment-list.json ||
            ! grep --fixed-strings --quiet '"slug":"staging"' environment-list.json ||
            [ -z "$environment_next_cursor" ]; then
            cat environment-list.headers environment-list.json server.log
            exit 1
          fi

          environment_second_page_status="$(
            curl --silent --show-error \
              --dump-header environment-second-page.headers \
              --output environment-second-page.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/environments?service_id=$service_created_id&limit=1&cursor=$environment_next_cursor"
          )"

          if [ "$environment_second_page_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' environment-second-page.headers ||
            ! grep --fixed-strings --quiet '"service_id":'"$service_created_id" environment-second-page.json ||
            ! grep --fixed-strings --quiet '"slug":"production"' environment-second-page.json ||
            ! grep --fixed-strings --quiet '"next_cursor":""' environment-second-page.json; then
            cat environment-second-page.headers environment-second-page.json server.log
            exit 1
          fi

          environment_updated_status="$(
            curl --silent --show-error \
              --request PATCH \
              --header 'Content-Type: application/json' \
              --data '{"name":"Staging Updated"}' \
              --dump-header environment-updated.headers \
              --output environment-updated.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/environments/$environment_created_id"
          )"

          if [ "$environment_updated_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' environment-updated.headers ||
            ! grep --fixed-strings --quiet '"id":'"$environment_created_id" environment-updated.json ||
            ! grep --fixed-strings --quiet '"service_id":'"$service_created_id" environment-updated.json ||
            ! grep --fixed-strings --quiet '"slug":"staging"' environment-updated.json ||
            ! grep --fixed-strings --quiet '"name":"Staging Updated"' environment-updated.json; then
            cat environment-updated.headers environment-updated.json server.log
            exit 1
          fi

          environment_conflict_status="$(
            curl --silent --show-error \
              --request PATCH \
              --header 'Content-Type: application/json' \
              --data '{"slug":"production"}' \
              --dump-header environment-conflict.headers \
              --output environment-conflict.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/environments/$environment_created_id"
          )"

          environment_conflict_header_id="$(
            grep --ignore-case '^x-request-id:' environment-conflict.headers |
              head -n 1 |
              awk '{print $2}' |
              tr -d '\r'
          )"
          environment_conflict_body_id="$(
            sed -n 's/.*"request_id":"\([^"]*\)".*/\1/p' environment-conflict.json
          )"

          if [ "$environment_conflict_status" != 409 ] ||
            [ -z "$environment_conflict_header_id" ] ||
            [ "$environment_conflict_header_id" != "$environment_conflict_body_id" ] ||
            ! grep --fixed-strings --quiet '"code":"conflict"' environment-conflict.json; then
            cat environment-conflict.headers environment-conflict.json server.log
            exit 1
          fi

          environment_deleted_status="$(
            curl --silent --show-error \
              --request DELETE \
              --dump-header environment-deleted.headers \
              --output environment-deleted.body \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/environments/$environment_created_id"
          )"

          if [ "$environment_deleted_status" != 204 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' environment-deleted.headers ||
            [ -s environment-deleted.body ]; then
            cat environment-deleted.headers environment-deleted.body server.log
            exit 1
          fi

          environment_missing_status="$(
            curl --silent --show-error \
              --dump-header environment-missing.headers \
              --output environment-missing.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/environments/$environment_created_id"
          )"

          environment_missing_header_id="$(
            grep --ignore-case '^x-request-id:' environment-missing.headers |
              head -n 1 |
              awk '{print $2}' |
              tr -d '\r'
          )"
          environment_missing_body_id="$(
            sed -n 's/.*"request_id":"\([^"]*\)".*/\1/p' environment-missing.json
          )"

          if [ "$environment_missing_status" != 404 ] ||
            [ -z "$environment_missing_header_id" ] ||
            [ "$environment_missing_header_id" != "$environment_missing_body_id" ] ||
            ! grep --fixed-strings --quiet '"code":"not_found"' environment-missing.json; then
            cat environment-missing.headers environment-missing.json server.log
            exit 1
          fi

          updated_status="$(
            curl --silent --show-error \
              --request PATCH \
              --header 'Content-Type: application/json' \
              --data '{"name":"CI Smoke Updated"}' \
              --dump-header updated.headers \
              --output updated.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/teams/$created_id"
          )"

          if [ "$updated_status" != 200 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' updated.headers ||
            ! grep --fixed-strings --quiet '"id":'"$created_id" updated.json ||
            ! grep --fixed-strings --quiet '"slug":"ci-smoke"' updated.json ||
            ! grep --fixed-strings --quiet '"name":"CI Smoke Updated"' updated.json; then
            cat created.headers created.json updated.headers updated.json server.log
            exit 1
          fi

          conflict_status="$(
            curl --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"slug":"ci-smoke","name":"CI Smoke Again"}' \
              --dump-header conflict.headers \
              --output conflict.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:8080/v1/teams
          )"

          if [ "$conflict_status" != 409 ]; then
            cat conflict.headers conflict.json server.log
            exit 1
          fi

          conflict_header_id="$(
            grep --ignore-case '^x-request-id:' conflict.headers |
              head -n 1 |
              awk '{print $2}' |
              tr -d '\r'
          )"
          conflict_body_id="$(
            sed -n 's/.*"request_id":"\([^"]*\)".*/\1/p' conflict.json
          )"

          if [ -z "$conflict_header_id" ] ||
            [ "$conflict_header_id" != "$conflict_body_id" ] ||
            ! grep --fixed-strings --quiet '"code":"conflict"' conflict.json; then
            cat conflict.headers conflict.json server.log
            exit 1
          fi

          deleted_status="$(
            curl --silent --show-error \
              --request DELETE \
              --dump-header deleted.headers \
              --output deleted.body \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/teams/$created_id"
          )"

          if [ "$deleted_status" != 204 ] ||
            ! grep --ignore-case --quiet '^x-request-id: [^[:space:]]' deleted.headers ||
            [ -s deleted.body ]; then
            cat created.headers created.json deleted.headers deleted.body server.log
            exit 1
          fi


          missing_status="$(
            curl --silent --show-error \
              --dump-header missing.headers \
              --output missing.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/teams/$created_id"
          )"

          missing_header_id="$(
            grep --ignore-case '^x-request-id:' missing.headers |
              head -n 1 |
              awk '{print $2}' |
              tr -d '\r'
          )"
          missing_body_id="$(
            sed -n 's/.*"request_id":"\([^"]*\)".*/\1/p' missing.json
          )"

          if [ "$missing_status" != 404 ] ||
            [ -z "$missing_header_id" ] ||
            [ "$missing_header_id" != "$missing_body_id" ] ||
            ! grep --fixed-strings --quiet '"code":"not_found"' missing.json; then
            cat created.headers created.json missing.headers missing.json server.log
            exit 1
          fi

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COMPOSE_PROJECT_NAME: lyapus-compose-ci
      LYAPUS_POSTGRES_DB: lyapus_compose_ci_test
      LYAPUS_POSTGRES_PORT: "55432"
      LYAPUS_HTTP_PORT: "8080"
      LYAPUS_DATABASE_URL: "postgres://lyapus:lyapus@127.0.0.1:55432/lyapus_compose_ci_test?sslmode=disable"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build pinned Atlas Community
        run: ./scripts/install-atlas-community.sh

      - name: Validate Compose and build API image
        run: |
          set -euo pipefail

          docker compose config --quiet
          docker compose --progress plain build apiserver

      - name: Start database and apply migrations
        run: |
          set -euo pipefail

          docker compose up -d --wait --wait-timeout 120 postgres

          ./.tools/bin/atlas migrate apply \
            --dir "file://db/migrations" \
            --url "$LYAPUS_DATABASE_URL"

          ./.tools/bin/atlas migrate status \
            --dir "file://db/migrations" \
            --url "$LYAPUS_DATABASE_URL"

          ./.tools/bin/atlas migrate apply \
            --dir "file://db/migrations" \
            --url "$LYAPUS_DATABASE_URL"

      - name: Start API and verify container delivery
        run: |
          set -euo pipefail

          docker compose up -d --no-build --pull never apiserver

          ready=false
          for _ in $(seq 1 30); do
            if curl --noproxy '*' --fail --silent --show-error \
              --max-time 2 \
              http://127.0.0.1:8080/readyz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "API did not become ready" >&2
            exit 1
          fi

          for endpoint in livez readyz; do
            status="$(
              curl --noproxy '*' --silent --show-error \
                --max-time 10 \
                --output "$endpoint.json" \
                --write-out '%{http_code}' \
                "http://127.0.0.1:8080/$endpoint"
            )"
            test "$status" = 200
            python3 -c 'import json, sys; assert json.load(open(sys.argv[1])) == {"status": "ok"}' "$endpoint.json"
          done

          created_status="$(
            curl --noproxy '*' --silent --show-error \
              --max-time 10 \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"slug":"compose-ci","name":"Compose CI"}' \
              --output compose-created.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:8080/v1/teams
          )"
          test "$created_status" = 201

          created_id="$(
            python3 -c '
          import json
          data = json.load(open("compose-created.json"))
          assert type(data["id"]) is int and data["id"] > 0
          assert data["slug"] == "compose-ci"
          assert data["name"] == "Compose CI"
          print(data["id"])
          '
          )"

          get_status="$(
            curl --noproxy '*' --silent --show-error \
              --max-time 10 \
              --output compose-get.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:8080/v1/teams/$created_id"
          )"
          test "$get_status" = 200

          python3 -c '
          import json
          created = json.load(open("compose-created.json"))
          fetched = json.load(open("compose-get.json"))
          assert fetched == created
          '

      - name: Show Compose diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
          for response in livez.json readyz.json compose-created.json compose-get.json; do
            if [ -f "$response" ]; then
              cat "$response"
            fi
          done

      - name: Clean up Compose project
        if: always()
        run: docker compose down --volumes --remove-orphans
